  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4f71a30b-f353-4962-b0e9-100a1a5f06a6\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"5522ab39-cfcb-42c3-b4e2-257248197cce\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"83de4218-3ef6-49c8-bb40-9a67ebe4646e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  /* ============================================================\n     LTT Consulting — intro web\n     Cómo integrar:\n       1. Copia el bloque <style> .ltt-* y el markup .ltt-stage.\n       2. Llama a lttIntroPlay() cuando quieras lanzarla\n          (por defecto arranca sola al cargar las fuentes).\n       3. Para elegir el final, cambia la clase del .ltt-lockup:\n          \"ltt-fade\"  (fundido · por defecto)\n          \"ltt-wipe\"  (cortina · barrido izq→der)\n          \"ltt-rise\"  (ascenso · sube desde máscara)\n     ============================================================ */\n  :root {\n    --ltt-papel:  #F4EFE6;\n    --ltt-tinta:  #1A1714;\n    --ltt-trigo:  #C9A227;\n    --ltt-ease:     cubic-bezier(0.22, 1, 0.36, 1);\n    --ltt-ease-out: cubic-bezier(0.16, 1, 0.3, 1);\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body { height: 100%; }\n  body { background: var(--ltt-tinta); overflow: hidden; }\n\n  .ltt-stage {\n    position: fixed;\n    inset: 0;\n    display: grid;\n    place-items: center;\n    font-family: 'Space Grotesk', system-ui, sans-serif;\n    background:\n      radial-gradient(120% 90% at 50% 46%, rgba(201,162,39,0.05), transparent 60%),\n      radial-gradient(140% 120% at 50% 50%, transparent 55%, rgba(0,0,0,0.45));\n  }\n\n  .ltt-lockup {\n    position: relative;\n    display: inline-flex;\n    align-items: center;\n    font-size: clamp(46px, 9.5vw, 132px);\n    line-height: 1;\n    opacity: 0;\n    transform: translateY(0.14em);\n    transition: opacity 0.55s var(--ltt-ease), transform 0.55s var(--ltt-ease);\n  }\n  .ltt-lockup.ltt-in { opacity: 1; transform: none; }\n\n  .ltt-letter {\n    display: block;\n    overflow: hidden;\n    white-space: nowrap;\n    min-width: 0;\n    font-weight: 600;\n    letter-spacing: -0.01em;\n    color: var(--ltt-papel);\n    transition: width 0.6s var(--ltt-ease), opacity 0.4s ease;\n  }\n\n  /* la cola (barra + Consulting) va absoluta → LTT nunca se desplaza */\n  .ltt-tail {\n    position: absolute;\n    left: 100%;\n    top: 50%;\n    transform: translateY(-50%);\n    display: flex;\n    align-items: center;\n    padding-left: 0.42em;\n    white-space: nowrap;\n  }\n  .ltt-bar {\n    width: 0.05em;\n    height: 0.72em;\n    background: var(--ltt-trigo);\n    flex-shrink: 0;\n    transform: scaleY(0);\n    transform-origin: center;\n  }\n  .ltt-subwrap { overflow: hidden; margin-left: 0.42em; }\n  .ltt-sub {\n    display: block;\n    font-family: 'IBM Plex Mono', monospace;\n    font-weight: 500;\n    font-size: 0.165em;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--ltt-papel);\n  }\n\n  .ltt-sweep {\n    position: absolute;\n    top: -20%; left: -30%;\n    width: 26%; height: 140%;\n    background: linear-gradient(100deg, transparent, rgba(244,239,230,0.10), transparent);\n    transform: skewX(-12deg) translateX(-260%);\n    pointer-events: none;\n    opacity: 0;\n  }\n  .ltt-go-sweep .ltt-sweep { animation: ltt-sweep 0.9s linear forwards; }\n  @keyframes ltt-sweep {\n    0%   { opacity: 0; transform: skewX(-12deg) translateX(-260%); }\n    15%  { opacity: 1; }\n    80%  { opacity: 1; }\n    100% { opacity: 0; transform: skewX(-12deg) translateX(1100%); }\n  }\n\n  /* FINAL · Fundido */\n  .ltt-fade .ltt-bar { transition: transform 0.5s var(--ltt-ease-out); }\n  .ltt-fade.ltt-reveal .ltt-bar { transform: scaleY(1); }\n  .ltt-fade .ltt-sub { opacity: 0; transform: translateY(0.24em); transition: opacity 0.5s ease, transform 0.6s var(--ltt-ease-out); }\n  .ltt-fade.ltt-reveal .ltt-sub { opacity: 0.62; transform: translateY(0); }\n\n  /* FINAL · Cortina */\n  .ltt-wipe .ltt-bar { transform-origin: bottom; transition: transform 0.45s var(--ltt-ease-out); }\n  .ltt-wipe.ltt-reveal .ltt-bar { transform: scaleY(1); }\n  .ltt-wipe .ltt-sub { opacity: 0.62; clip-path: inset(0 100% 0 0); transition: clip-path 0.62s var(--ltt-ease-out); }\n  .ltt-wipe.ltt-reveal .ltt-sub { clip-path: inset(0 0 0 0); }\n\n  /* FINAL · Ascenso */\n  .ltt-rise .ltt-bar { transform-origin: center; transition: transform 0.5s var(--ltt-ease-out); }\n  .ltt-rise.ltt-reveal .ltt-bar { transform: scaleY(1); }\n  .ltt-rise .ltt-sub { opacity: 0.62; transform: translateY(115%); transition: transform 0.66s var(--ltt-ease-out); }\n  .ltt-rise.ltt-reveal .ltt-sub { transform: translateY(0); }\n\n  @media (prefers-reduced-motion: reduce) {\n    .ltt-lockup, .ltt-letter, .ltt-bar, .ltt-sub { transition: none !important; }\n    .ltt-sweep { display: none; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"ltt-stage\">\n  <!-- Cambia \"ltt-fade\" por \"ltt-wipe\" o \"ltt-rise\" para otro final -->\n  <div class=\"ltt-lockup ltt-fade\" id=\"lttLockup\">\n    <span class=\"ltt-letter\" data-keep=\"\">L<\u002Fspan>\n    <span class=\"ltt-letter\">A<\u002Fspan>\n    <span class=\"ltt-letter\" data-keep=\"\">T<\u002Fspan>\n    <span class=\"ltt-letter\">R<\u002Fspan>\n    <span class=\"ltt-letter\">A<\u002Fspan>\n    <span class=\"ltt-letter\">S<\u002Fspan>\n    <span class=\"ltt-letter\" data-keep=\"\">T<\u002Fspan>\n    <span class=\"ltt-letter\">I<\u002Fspan>\n    <span class=\"ltt-letter\">E<\u002Fspan>\n    <span class=\"ltt-letter\">N<\u002Fspan>\n    <span class=\"ltt-letter\">D<\u002Fspan>\n    <span class=\"ltt-letter\">A<\u002Fspan>\n    <span class=\"ltt-tail\">\n      <span class=\"ltt-bar\"><\u002Fspan>\n      <span class=\"ltt-subwrap\"><span class=\"ltt-sub\">Consulting<\u002Fspan><\u002Fspan>\n    <\u002Fspan>\n    <span class=\"ltt-sweep\"><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  (function () {\n    const lockup  = document.getElementById('lttLockup');\n    const letters = [...lockup.querySelectorAll('.ltt-letter')];\n    const reduce  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let timers = [];\n\n    function clearTimers() { timers.forEach(clearTimeout); timers = []; }\n\n    function measure() {\n      letters.forEach(l => { l.style.width = ''; l.style.opacity = ''; });\n      letters.forEach(l => { l.dataset.w = l.getBoundingClientRect().width; });\n    }\n    function setStart() {\n      letters.forEach(l => { l.style.width = l.dataset.w + 'px'; l.style.opacity = '1'; });\n      lockup.classList.remove('ltt-reveal', 'ltt-go-sweep');\n    }\n\n    function play() {\n      clearTimers();\n      measure();\n      lockup.classList.remove('ltt-in');\n      setStart();\n      void lockup.offsetWidth;\n      lockup.classList.add('ltt-in');\n\n      if (reduce) {\n        letters.forEach(l => { if (!l.hasAttribute('data-keep')) { l.style.width = '0px'; l.style.opacity = '0'; } });\n        lockup.classList.add('ltt-reveal');\n        return;\n      }\n      // 1 — LATRASTIENDA → LTT (colapso horizontal)\n      timers.push(setTimeout(() => {\n        letters.forEach(l => { if (!l.hasAttribute('data-keep')) { l.style.width = '0px'; l.style.opacity = '0'; } });\n      }, 780));\n      // 2 — aparece la cola (barra + Consulting) + barrido de luz\n      timers.push(setTimeout(() => {\n        lockup.classList.add('ltt-reveal', 'ltt-go-sweep');\n      }, 1480));\n    }\n\n    // expón el disparador para integrarlo donde quieras\n    window.lttIntroPlay = play;\n\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(play);\n    else window.addEventListener('load', play);\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
